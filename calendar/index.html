<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar · Ajay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../schedule/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app page-enter">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-text">
                    <a href="../index.html" class="back-link"><i data-lucide="arrow-left"></i> Home</a>
                    <h1 class="greeting" style="margin-top:0.6rem;">My <span class="accent">Calendar</span></h1>
                </div>
                <button class="avatar-btn" id="actionBtn" aria-label="Account">
                    <i data-lucide="log-in"></i>
                </button>
            </div>

            <div class="hero-card">
                <div class="hero-glow"></div>
                <div class="hero-content">
                    <span class="hero-tag"><i data-lucide="calendar-heart"></i> Today · <span id="todayDate">--</span></span>
                    <p class="hero-text" id="heroText">Connecting to Google Calendar...</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main stagger-list">
            <!-- Sign-in card (shown when not connected) -->
            <section class="widget" id="signinCard" hidden>
                <div class="signin-wrap">
                    <div class="signin-icon"><i data-lucide="calendar-clock"></i></div>
                    <h2 class="signin-title">Connect Google Calendar</h2>
                    <p class="signin-desc" id="signinDesc">Sign in with Google to see your events right here, alongside the rest of your day.</p>
                    <button class="primary-btn" id="signinBtn"><i data-lucide="log-in"></i> Sign in with Google</button>
                </div>
            </section>

            <!-- Today's Agenda -->
            <section class="widget" id="todayCard" hidden>
                <div class="widget-header">
                    <div class="widget-heading">
                        <i data-lucide="sun" class="widget-icon"></i>
                        <h2>Today</h2>
                    </div>
                    <span class="sync-pill" id="syncPill"><i data-lucide="check-circle-2"></i> Synced</span>
                </div>
                <div class="schedule-list" id="todayList">
                    <div class="empty-state">No events today</div>
                </div>
            </section>

            <!-- Upcoming -->
            <section class="widget" id="upcomingCard" hidden>
                <div class="widget-header">
                    <div class="widget-heading">
                        <i data-lucide="calendar-days" class="widget-icon"></i>
                        <h2>Upcoming</h2>
                    </div>
                </div>
                <div class="schedule-list" id="upcomingList">
                    <div class="empty-state">Nothing else this week</div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Live from Google Calendar · Powered by <span class="footer-accent">Claude</span></p>
        </footer>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="../config.js"></script>
    <script src="calendar-lib.js"></script>
    <script src="script.js"></script>
</body>
</html>
